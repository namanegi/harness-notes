<main id="main" class="prose"><p class="eyebrow"><a href="/harness-notes/zh/glossary/">术语表</a></p><h1>Top-1 · 首位相关率</h1><p class="term-lede">在本站重排实验中，排名第一的结果被标为相关的问题，占全部问题的比例。</p><p>每个问题只看第一条是否相关；过滤后没有结果也记作未命中。即使一个问题有十篇相关文档，也最多贡献一次命中。其他语境里的 top-1 可能指分类准确率，这个词条解释的是该检索实验中的定义。</p><h2>相关实验与笔记</h2><ul><li><a href="/harness-notes/zh/projects/jev-rerank/">用 Jev 做 RAG：检索、排序与阈值校准</a></li></ul></main>
