<main id="main" class="prose"><p class="eyebrow"><a href="/harness-notes/zh/glossary/">术语表</a></p><h1>Reranking · 重排</h1><p class="term-lede">对已经召回的候选再次判断相关性并调整次序，让有用证据排得更靠前。</p><p>重排能把初次检索排得较低的有用候选提上来，但找不回根本没进入候选池的文档。删除候选是额外的过滤步骤，需要单独评估误删相关证据的风险。</p><h2>参考来源</h2><ul><li><a href="https://sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html">Sentence Transformers：检索与重排</a></li></ul><h2>相关实验与笔记</h2><ul><li><a href="/harness-notes/zh/projects/">实验笔记</a></li><li><a href="/harness-notes/zh/projects/jev-rerank/">用 Jev 做 RAG：检索、排序与阈值校准</a></li></ul></main>
