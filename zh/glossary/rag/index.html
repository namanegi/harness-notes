<main id="main" class="prose"><p class="eyebrow"><a href="/harness-notes/zh/glossary/">术语表</a></p><h1>RAG · 检索增强生成</h1><p class="term-lede">先检索相关资料，再把资料作为上下文交给模型生成回答。</p><p>常见流程是召回候选、按需重排或过滤，再依据选出的证据生成回答。本站 Jev 重排实验只评估检索与排序部分。检索指标变好，并不能直接证明生成回答也更准确。</p><h2>参考来源</h2><ul><li><a href="https://arxiv.org/abs/2005.11401">Lewis 等：Retrieval-Augmented Generation 原始论文</a></li></ul><h2>相关实验与笔记</h2><ul><li><a href="/harness-notes/zh/projects/jev-rerank/">用 Jev 做 RAG：检索、排序与阈值校准</a></li></ul></main>
