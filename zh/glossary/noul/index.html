<main id="main" class="prose"><p class="eyebrow"><a href="/harness-notes/zh/glossary/">术语表</a></p><h1>Noul</h1><p class="term-lede">TypeSafe 的是非判断类型，返回答案为“是”的概率。程序可设置阈值，把它转成过滤决策。</p><p>本站重排实验问的是：这个 chunk 是否包含有用证据。在过滤条件下，低于阈值的片段会被删除。阈值改变了保留噪声与误删证据之间的取舍；接口返回一个概率值，并不等于已经验证它在当前数据集上的校准程度。</p><h2>参考来源</h2><ul><li><a href="https://docs.typesafe.ai/primitives/noul">TypeSafe：Noul</a></li></ul><h2>相关实验与笔记</h2><ul><li><a href="/harness-notes/zh/projects/jev-rerank/">用 Jev 做 RAG：检索、排序与阈值校准</a></li></ul></main>
