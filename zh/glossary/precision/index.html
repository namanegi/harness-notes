<main id="main" class="prose"><p class="eyebrow"><a href="/harness-notes/zh/glossary/">术语表</a></p><h1>Precision · 精确率</h1><p class="term-lede">返回的材料中有多少是相关的。本站 P@10 固定用十作分母，即使最后不足十条也不变。</p><p>如果前十条中有三条相关，P@10 就是 3/10 = 0.3。在过滤实验里，即使最后只保留这三条相关文档，固定分母下仍为 0.3。如果改算幸存文档中的相关比例，会得到 3/3；那是另一个指标。</p><h2>参考来源</h2><ul><li><a href="https://nlp.stanford.edu/IR-book/html/htmledition/evaluation-of-unranked-retrieval-sets-1.html">《信息检索导论》：精确率与召回率</a></li></ul></main>
