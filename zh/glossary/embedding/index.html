<main id="main" class="prose"><p class="eyebrow"><a href="/harness-notes/zh/glossary/">术语表</a></p><h1>Embedding · 向量嵌入</h1><p class="term-lede">把内容表示为数值向量。检索可以比较问题与文档向量，寻找可能相关的材料。</p><p>本站重排实验先计算问题和片段向量的余弦相似度。相似度用于寻找候选，不能证明片段一定包含回答所需事实。该实验的整组费用包含生成 embedding 的成本。</p><h2>参考来源</h2><ul><li><a href="https://sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html">Sentence Transformers：向量检索</a></li></ul><h2>相关实验与笔记</h2><ul><li><a href="/harness-notes/zh/projects/">实验笔记</a></li><li><a href="/harness-notes/zh/projects/jev-rerank/">用 Jev 做 RAG：检索、排序与阈值校准</a></li></ul></main>
